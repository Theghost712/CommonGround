# CommonGround behind nginx (TLS termination, static/media, WebSockets, edge rate limits).
# Pair with: DJANGO_ENV=production, NUM_PROXIES=1, MEDIA_ACCEL_REDIRECT_PREFIX=/protected-media/

limit_req_zone $binary_remote_addr zone=api:20m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

upstream commonground_app { server 127.0.0.1:8000; keepalive 64; }

server {
    listen 80;
    server_name example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.org;
    ssl_certificate     /etc/letsencrypt/live/example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;

    client_max_body_size 110m;           # 10 photos or one 100 MB video post
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # React build (npm run build → frontend/dist). Hashed assets are cached for a year.
    root /srv/commonground/frontend/dist;
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    # The app shell: never cached (so deploys show up at once), with a strict
    # Content-Security-Policy. img-src allows https: because profile avatars are URLs.
    # Replace example.org in connect-src with your domain.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' wss://example.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Health check for the load balancer / uptime monitor (no rate limit).
    location = /api/v1/health/ {
        proxy_pass http://commonground_app;
        include /etc/nginx/proxy_params;
    }

    location /static/ { alias /srv/commonground/backend/staticfiles/; expires 30d; }

    # Only reachable via X-Accel-Redirect after Django has checked permission.
    location /protected-media/ {
        internal;
        alias /srv/commonground/backend/media/;
    }

    location /api/v1/auth/token/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://commonground_app;
        include /etc/nginx/proxy_params;
    }

    location ~ ^/(api|admin)/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://commonground_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://commonground_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
