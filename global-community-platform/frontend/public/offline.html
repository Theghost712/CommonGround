<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline · CommonGround</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#f7f8fc;color:#202536;padding:16px;box-sizing:border-box}
  main{max-width:360px;text-align:center}
  img{width:64px;height:64px;border-radius:16px}
  h1{font-size:22px;margin:18px 0 8px}
  p{color:#6b7182;line-height:1.6;font-size:14px;margin:0 0 20px}
  button{border:0;border-radius:8px;background:#6558d9;color:#fff;font:600 14px system-ui,sans-serif;padding:11px 18px;cursor:pointer}
  @media (prefers-color-scheme:dark){body{background:#14151f;color:#eceef5}p{color:#a3a8b8}}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="" />
  <h1>You're offline</h1>
  <p>CommonGround needs an internet connection. Check your Wi-Fi or mobile data, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
