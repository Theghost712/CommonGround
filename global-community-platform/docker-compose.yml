services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: community_db
      POSTGRES_USER: community_user
      POSTGRES_PASSWORD: community_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U community_user -d community_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
